apiVersion: apps/v1
kind: Deployment
metadata:
  name: noticeboard-deployment
  labels:
    app: noticeboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noticeboard
  template:
    metadata:
      labels:
        app: noticeboard
    spec:
      containers:
        - name: noticeboard-app
          image: pdgamersg/noticeboard-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: noticeboard-service
spec:
  type: NodePort
  selector:
    app: noticeboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
